<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">SUFEES LOUNGE</a>
            </div>
            <ul class="nav-menu" id="nav-menu">

                <li class="nav-item">

                <li class="nav-item">

            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Menu Hero -->
    <section class="menu-hero">
        <div class="menu-hero-overlay"></div>
        <div class="container">
            <h1 class="menu-title">Our Menu</h1>
            <p class="menu-subtitle">Muske Ka Chaska - Full Menu</p>
        </div>
    </section>

    <!-- Menu Filters - FIXED DATA ATTRIBUTES -->
    <section class="menu-section">
        <div class="container">
            <div class="menu-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="muske_ka_chaska">Muske Ka Chaska</button>
            <button class="filter-btn" data-filter="pizza">Pizza</button>
            <button class="filter-btn" data-filter="ande_ka_funda">Ande Ka Funda</button>

            <button class="filter-btn" data-filter="maggie">Maggie</button>

            <button class="filter-btn" data-filter="burger">Burger</button>
            <button class="filter-btn" data-filter="shakes_mocktails">Shakes & Mocktails</button>
            <button class="filter-btn" data-filter="pasta">Pasta</button>
            <button class="filter-btn" data-filter="beverages">Beverages</button>
            <button class="filter-btn" data-filter="dessert">Dessert</button>
            </div>

            <!-- Menu Categories - Generated by JS -->
            <div id="menuCategories"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
